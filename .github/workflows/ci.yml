name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      # Full suite, including the exhaustive all-hands checks.
      - run: go test ./...
      # Race detector on the quick suite: the exhaustive checks take
      # minutes under -race, and they exercise no concurrency anyway.
      - run: go test -race -short ./...
