[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "poker-player"
version = "0.1.0"
description = "A heads-up Texas Hold'em engine and simple bots"
readme = "README.md"
requires-python = ">=3.11"

[project.scripts]
poker-advisor = "poker_bot.advisor:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
